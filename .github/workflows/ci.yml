name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (Vite + SEO pages)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml is missing"; exit 1; }
          test -f dist/region/turkey/index.html || { echo "::error::dist/region/turkey/index.html is missing"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet Go server
        run: go vet ./...

      - name: Build Go server
        run: go build -o /dev/null main.go
